<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hexstead</title>
  <meta name="description" content="Settle an island with friends. Trade, build and race to 10 points. Online rooms for 2–6 players, or play against bots.">
  <meta name="theme-color" content="#10293D">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5' fill='%23E2B243' stroke='%230D2233' stroke-width='5'/%3E%3Cpath d='M20 44V30l12-10 12 10v14z' fill='%230D2233'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bricolage-grotesque-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-next-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <noscript><p class="noscript">Hexstead needs JavaScript to run.</p></noscript>

  <!-- Home -->
  <section id="home" class="screen home" hidden>
    <div class="home-art" aria-hidden="true"><svg class="board home-board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="home-panel">
      <h1 class="wordmark">Hexstead</h1>
      <p class="tagline">Settle an island with friends. Trade what you have for what you need, and race to 10 points.</p>

      <form class="home-form" id="home-form" autocomplete="off">
        <label class="field">
          <span>Your name</span>
          <input id="home-name" name="name" maxlength="24" required placeholder="What should we call you?">
        </label>

        <div class="online-block" id="online-block">
          <button type="button" class="btn primary big" id="create-room">Create a room</button>
          <div class="join-row">
            <label class="field code-field">
              <span>Room code</span>
              <input id="join-code" name="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" spellcheck="false" inputmode="text">
            </label>
            <button type="button" class="btn" id="join-room">Join</button>
          </div>
          <p class="note" id="online-note" hidden></p>
        </div>

        <div class="local-block">
          <button type="button" class="btn" id="resume-local" hidden>Resume your game on this device</button>
          <button type="button" class="btn ghost" id="play-local">Play on this device</button>
        </div>
      </form>
      <button type="button" class="link" id="home-rules">How to play</button>
    </div>
  </section>

  <!-- Local game setup -->
  <section id="local" class="screen setup" hidden>
    <div class="setup-panel">
      <button type="button" class="link back" data-nav="home">Back</button>
      <h1>Play on this device</h1>
      <p class="sub">Play against bots, or pass the device between friends.</p>

      <fieldset class="board-pick">
        <legend>Island</legend>
        <label class="pick"><input type="radio" name="local-board" value="base" checked><span><b>Standard</b><small>19 hexes, 2–4 players</small></span></label>
        <label class="pick"><input type="radio" name="local-board" value="ext"><span><b>Large: 5–6 player expansion</b><small>30 hexes, up to 6 players</small></span></label>
      </fieldset>

      <h2 class="h-sub">Players</h2>
      <ol class="seat-list" id="local-seats"></ol>
      <button type="button" class="btn ghost small" id="local-add">Add a player</button>

      <div class="options" id="local-options"></div>

      <div class="setup-foot">
        <button type="button" class="btn primary big" id="local-start">Start game</button>
        <button type="button" class="link" data-rules>How to play</button>
      </div>
    </div>
  </section>

  <!-- Online lobby -->
  <section id="lobby" class="screen setup" hidden>
    <div class="setup-panel">
      <button type="button" class="link back" id="lobby-leave">Leave room</button>
      <div class="room-head">
        <div>
          <p class="sub">Room code</p>
          <p class="room-code" id="lobby-code"></p>
        </div>
        <div class="room-share">
          <button type="button" class="btn small" id="lobby-copy">Copy invite link</button>
          <button type="button" class="btn small ghost" id="lobby-share" hidden>Share</button>
        </div>
      </div>
      <p class="sub" id="lobby-status"></p>

      <h2 class="h-sub" id="lobby-count">Players</h2>
      <ol class="seat-list" id="lobby-seats"></ol>
      <button type="button" class="btn ghost small" id="lobby-bot" hidden>Add a bot</button>

      <div class="me-block" id="lobby-me"></div>

      <div class="options" id="lobby-options"></div>

      <div class="setup-foot">
        <button type="button" class="btn primary big" id="lobby-start" hidden>Start game</button>
        <p class="sub" id="lobby-wait"></p>
        <button type="button" class="link" data-rules>How to play</button>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen game" hidden></section>

  <div id="boot" class="boot">Loading…</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
